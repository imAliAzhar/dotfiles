import:
  - ~/.config/alacritty/themes/catppuccin-macchiato.yml

font:
  normal:
    family: "Victor Mono"
    style: Regular
  italic:
    family: "Victor Mono"
    style: Italic
  bold:
    family: "Victor Mono"
    style: Bold
  bold_italic:
    family: "Victor Mono"
    style: Italic

  # Point size
  size: 18.0

  offset:
    x: 0
    y: 0
  glyph_offset:
    x: 0
    y: 0

window:
  startup_mode: Maximized
  decorations: buttonless # full, buttonless, transparent, none
  dynamic_padding: true

  option_as_alt: OnlyLeft
  padding:
    x: 23
    y: 23
    # shell:
    #   program: /bin/zsh
    #   args:
    #       - -l
    #       - -c
    #       - "tmux ls && read tmux_session && tmux attach -t ${tmux_session:-default} || tmux new -s ${tmux_session:-default}"
    dynamic_padding: true

scrolling:
  # Maximum number of lines in the scrollback buffer.
  # Specifying '0' will disable scrolling.
  history: 10000

  # Number of lines the viewport will move for every line scrolled when
  # scrollback is enabled (history > 0).
  multiplier: 10

# If `true`, bold text is drawn using the bright color variants.
draw_bold_text_with_bright_colors: true

selection:
  semantic_escape_chars: ',│`|:"'' ()[]{}<>'
  save_to_clipboard: true

live_config_reload: true

env:
  TERM: xterm-256color

key_bindings:
  # use `xxd -ps` to get hexdump

# Tmux - Open Session Selector
- { mods: Command, key: R, chars: "\x60\x72" }

# Tmux - Create new window
- { mods: Command, key: T, chars: "\x60\x74" }
- { mods: Command|Shift, key: T, chars: "\x60\x54" }

# Tmux - Navigate right
- { mods: Command, key: L, chars: "\x60\x29" }

# Tmux - Navigate left
- { mods: Command, key: H, chars: "\x60\x28" }

# Tmux - Open something
- { mods: Command, key: O, chars: "\x60\x6f" }

# Tmux - Navigate down
- { mods: Command, key: J, chars: "\x60\x6e" }

# Tmux - Navigate up
- { mods: Command, key: K, chars: "\x60\x70" }

# Editor - Close window
- { mods: Command, key: W, chars: "\x20\x77" }

# Editor - Open LazyGit
- { mods: Command, key: G, chars: "\x60\x67" }

# Editor - Search
- { mods: Command, key: Slash, chars: "\x20\x2f" }

# Editor - Save
- { mods: Command, key: S, chars: "\x20\x73" }
- { mods: Command|Shift, key: S, chars: "\x20\x53" }

# Editor - Quick Open
- { mods: Command, key: P, chars: "\x20\x06\x0a" }

# Editor - Open Explorer
- { mods: Command, key: E, chars: "\x20\x65" }

# Editor - Search text in project
- { mods: Command|Shift, key: F, chars: "\x20\x46" }


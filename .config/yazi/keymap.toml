[[mgr.prepend_keymap]]
on = [ "O" ]
run = "shell 'open -R $0'"
desc = "Open the file in Finder"

[[mgr.prepend_keymap]]
on   = "o"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "!"
run  = 'shell "$SHELL" --block --confirm'
desc = "Open shell here"

[[mgr.prepend_keymap]]
on = "q"
run = "close"
desc = "Close the current tab, or quit if it is last tab"

[[mgr.prepend_keymap]]
on   = "b"
run  = "plugin toggle-pane min-preview"
desc = "Show or hide the preview pane"

# TODO: Patch plugin to auto open files as well
[[mgr.prepend_keymap]]
on   = [ "s" ]
run = "plugin searchjump -- autocd"
desc = "searchjump mode (auto cd select folder)"

[[mgr.prepend_keymap]]
on   = [ "f" ]
run = "search fd"
desc = "Search files by name using fd"

[[mgr.prepend_keymap]]
on   = [ "F" ]
run = "search rg"
desc = "Search files by content using ripgrep"

[[mgr.prepend_keymap]]
on = "S"
run = "filter --smart"
desc = "Filter files"

[[mgr.prepend_keymap]]
on = [ "g", "b" ]
run = "cd ~/.local/bin"
desc = "Go to the config directory"

[[mgr.prepend_keymap]]
on = [ "g", "n" ]
run = "cd ~/.config/nvim/lua/plugins"
desc = "Go to the nvim plugins directory"

[[mgr.prepend_keymap]]
on = [ "g", "D" ]
run = "cd '~/Library/CloudStorage/GoogleDrive-aliazharthegreat@gmail.com/My Drive/Documents'"
desc = "Go to the Documents"

